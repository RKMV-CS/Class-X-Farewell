<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guess Who Review</title>
<style>
:root{--bg:#0b0b0d;--panel:#16161a;--line:#26262c;--fg:#f2f2f4;--dim:#8a8a94;--g:#1ed760;--y:#f5c542}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px -apple-system,system-ui,"Segoe UI",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:14px;align-items:center}
header h1{font-size:16px;margin:0}header small{color:var(--dim)}header a{margin-left:auto;color:var(--g);text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
video{width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:12px;display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
button{background:#25252c;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
button:hover{background:#2f2f38}button.ok{background:#14532d;border-color:var(--g)}button.chg{background:#5a4510;border-color:var(--y)}
button.sel{outline:2px solid #fff}
input{flex:1;min-width:240px;background:#0f0f12;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit}
h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
figure img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
figcaption{padding:6px 10px;color:var(--dim);font-size:12px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9}
#lb img{max-width:96vw;max-height:96vh}
.saved{color:var(--dim);font-size:12px}
</style></head><body>
<header><h1>Guess Who: look review</h1><small>live preview, every student, 10 s guess timer, no audio</small><a href="/prototype/guesswho-preview/index.html" target="_blank">Open live HTML &#8599;</a></header>
<div class="wrap">
<iframe id="v" src="/prototype/guesswho-preview/index.html" style="width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:12px;display:block"></iframe>
<div class="bar" id="jump"></div>
<div class="bar">
<button class="ok" id="bok" onclick="mark('ok')">&#10003; Approve look</button>
<button class="chg" id="bchg" onclick="mark('chg')">Needs change</button>
<input id="note" placeholder="Note (bigger card? more colour glow? timing?)" oninput="save()">
<span class="saved" id="sv"></span>
</div>
</div>
<div id="lb" onclick="this.style.display='none'"></div>
<script>
const v=document.getElementById('v'),K='guesswho-review';
let s={};try{s=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
function win(){return v.contentWindow}
v.onload=()=>{const w=win(),go=()=>{const I=w.GUESSWHO_INFO;if(!I){setTimeout(go,200);return}
document.getElementById('jump').innerHTML=I.starts.map((t,i)=>`<button onclick="win().setT(${t})">${w.GUESSWHO_STUDENTS?w.GUESSWHO_STUDENTS[i]:'Round '+(i+1)}</button>`).join('')};go()};
function paint(){bok.classList.toggle('sel',s.s==='ok');bchg.classList.toggle('sel',s.s==='chg');note.value=s.note||''}
function save(){s.note=note.value;try{localStorage.setItem(K,JSON.stringify(s));sv.textContent='saved'}catch(e){sv.textContent='not saved'}}
function mark(x){s.s=x;paint();save()}
paint();
</script></body></html>
